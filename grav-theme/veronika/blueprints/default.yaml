title: Domovská stránka
'@extends':
  type: default
  context: blueprints://pages
form:
  fields:
    tabs:
      type: tabs
      fields:
        tab_uvod:
          type: tab
          title: Úvod
          fields:
            header.intro_kicker: { type: text, label: 'Malý nadpis' }
            header.intro_title: { type: text, label: 'Nadpis' }
            header.intro_title_em: { type: text, label: 'Nadpis – zvýraznená časť' }
            header.intro_quote: { type: textarea, label: 'Citát', rows: 2 }
            header.intro_p1: { type: textarea, label: 'Odsek 1', rows: 4 }
            header.intro_p2: { type: textarea, label: 'Odsek 2', rows: 3 }
            header.intro_sign: { type: text, label: 'Podpis' }
            header.intro_photo: { type: file, label: 'Profilová fotka', destination: 'self@', accept: ['image/*'] }
        tab_kontakt:
          type: tab
          title: Kontakt
          fields:
            header.c_addr: { type: text, label: 'Adresa' }
            header.c_addr_note: { type: text, label: 'Adresa – poznámka' }
            header.c_phone: { type: text, label: 'Telefón' }
            header.c_email: { type: text, label: 'E-mail' }
            header.c_ig: { type: text, label: 'Instagram (@meno)' }
            header.c_hours: { type: text, label: 'Objednávky / hodiny' }
            header.c_hours_note: { type: text, label: 'Hodiny – poznámka' }
            header.c_booking: { type: text, label: 'Odkaz na online rezerváciu' }
        tab_cennik:
          type: tab
          title: Cenník
          fields:
            header.cennik:
              type: list
              label: 'Cenník – skupiny'
              collapsed: true
              fields:
                .title: { type: text, label: 'Názov skupiny' }
                .items:
                  type: list
                  label: 'Položky'
                  fields:
                    .name: { type: text, label: 'Názov' }
                    .desc: { type: text, label: 'Popis (nepovinné)' }
                    .price: { type: text, label: 'Cena' }

        tab_galeria:
          type: tab
          title: Galéria
          fields:
            header.gallery_pmu:
              type: list
              label: 'Galéria — Permanentný make-up'
              fields:
                .media: { type: pagemediaselect, label: 'Fotka / video' }
                .label: { type: text, label: 'Popis (nepovinné)' }
            header.gallery_nechty:
              type: list
              label: 'Galéria — Nechty'
              fields:
                .media: { type: pagemediaselect, label: 'Fotka / video' }
                .label: { type: text, label: 'Popis (nepovinné)' }
        tab_sluzby:
          type: tab
          title: Služby
          fields:
            header.overview:
              type: list
              label: 'Prehľad na úvodnej stránke (karty)'
              collapsed: true
              fields:
                .title: { type: text, label: 'Názov' }
                .desc: { type: textarea, label: 'Popis', rows: 2 }
                .target: { type: select, label: 'Odkaz na', default: sluzby, options: { sluzby: 'Služby', kontakt: 'Kontakt', cennik: 'Cenník', galeria: 'Galéria' } }
                .tag: { type: text, label: 'Text odkazu (napr. Zobraziť →)' }
            header.services:
              type: list
              label: 'Detail služieb (karty)'
              collapsed: true
              fields:
                .icon: { type: select, label: 'Ikona', options: { brow: 'Obočie', lips: 'Pery', laser: 'Laser', nail: 'Manikúra', foot: 'Pedikúra' } }
                .title: { type: text, label: 'Názov' }
                .tag: { type: text, label: 'Štítok' }
                .short: { type: textarea, label: 'Krátky popis', rows: 3 }
                .long: { type: textarea, label: 'Text po rozkliknutí (Prečítať viac) — podporuje **tučné**', rows: 8 }
        tab_faq:
          type: tab
          title: FAQ
          fields:
            header.faq:
              type: list
              label: 'Časté otázky'
              collapsed: true
              fields:
                .q: { type: text, label: 'Otázka' }
                .a: { type: textarea, label: 'Odpoveď', rows: 3 }
        tab_starostlivost:
          type: tab
          title: 'Starostlivosť a Kurzy'
          fields:
            header.care_title: { type: text, label: 'Nadpis – starostlivosť' }
            header.care:
              type: list
              label: 'Kroky starostlivosti'
              fields:
                .title: { type: text, label: 'Názov kroku' }
                .text: { type: textarea, label: 'Text', rows: 2 }
            header.care_note: { type: textarea, label: 'Poznámka pod krokmi', rows: 2 }
            header.kurzy_title: { type: text, label: 'Kurzy – nadpis' }
            header.kurzy_lead: { type: textarea, label: 'Kurzy – úvodný text', rows: 3 }
            header.kurzy_note: { type: textarea, label: 'Kurzy – poznámka', rows: 2 }
        tab_pravne:
          type: tab
          title: 'GDPR'
          fields:
            header.gdpr: { type: textarea, label: 'Ochrana osobných údajov (podporuje ### nadpisy a **tučné**)', rows: 20 }